<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="shortcut icon" href="Assets/images/icon.png" type="image/jpeg">
  <title>Client Data Summary</title>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1a365d',
            secondary: '#2d3748',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <header class="mb-12 text-center">
      <h1 class="text-4xl font-bold text-primary mb-4">WBS DASHBOARD</h1>
      <div class="h-1 w-32 bg-blue-500 mx-auto rounded"></div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Summary Section -->
      <div class="bg-white rounded-lg shadow-lg p-6">
        <div id="summary" class="space-y-4"></div>
      </div>

      <!-- Chart Section -->
      <div class="bg-white rounded-lg shadow-lg p-6">
        <canvas id="proceedsChart" class="w-full max-w-lg mx-auto"></canvas>
      </div>
    </div>
  </div>

  <script src="Assets/js/main.js"></script>
</body>
</html>
