<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ SEO Meta Tags -->
  <meta name="title" content="WBS Dashboard - Track Payments & Sessions">
  <meta name="description" content="Monitor payments, track client sessions, and analyze financial trends with WBS Dashboard. Stay updated with detailed finance insights.">
  <meta name="keywords" content="finance dashboard, client payments, session tracking, financial analysis, WBS Dashboard">
  <meta name="author" content="CHARLES KINARO">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://wbs.ckn.co.ke/"> 

  <!-- ✅ Open Graph (OG) Meta Tags for Social Media -->
  <meta property="og:title" content="WBS Dashboard - Track Payments & Sessions">
  <meta property="og:description" content="Monitor payments, track client sessions, and analyze financial trends with WBS Dashboard.">
  <meta property="og:image" content="https://raw.githubusercontent.com/7442charles/wbs_backend/refs/heads/main/Assets/images/icon.jpeg"> <!-- ✅ Replace with actual image URL -->
  <meta property="og:url" content="https://wbs.ckn.co.ke/">
  <meta property="og:type" content="website">
  
  <!-- ✅ Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="WBS Dashboard - Track Payments & Sessions">
  <meta name="twitter:description" content="Monitor payments, track client sessions, and analyze financial trends with WBS Dashboard.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/7442charles/wbs_backend/refs/heads/main/Assets/images/icon.jpeg"> <!-- ✅ Replace with actual image URL -->


  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="shortcut icon" href="Assets/images/icon.png" type="image/jpeg">
  <title>WBS DASHBOARD</title>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1a365d',
            secondary: '#2d3748',
          }
        }
      }
    }
  </script>
  <style>
    .dark .chart-container canvas {
      filter: invert(1) hue-rotate(180deg);
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors duration-200">
  <div class="container mx-auto px-4 py-8">
    <header class="mb-12 text-center relative">
      <div class="absolute right-4 top-0">
        <button 
          id="theme-toggle" 
          class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200"
          aria-label="Toggle dark mode"
        >
          <!-- Sun icon for dark mode -->
          <svg 
            class="hidden dark:block w-6 h-6 text-yellow-300" 
            fill="none" 
            stroke="currentColor" 
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <!-- Moon icon for light mode -->
          <svg 
            class="block dark:hidden w-6 h-6 text-gray-600" 
            fill="none" 
            stroke="currentColor" 
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
      <h1 class="text-4xl font-bold text-primary dark:text-white mb-4">WBS DASHBOARD</h1>
      <div class="h-1 w-32 bg-blue-500 mx-auto rounded"></div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Summary Section -->
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 transition-colors duration-200">
        <div id="summary" class="space-y-4 text-gray-800 dark:text-gray-200"></div>
      </div>

      <!-- Chart Section -->
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 transition-colors duration-200">
        <div class="chart-container">
          <canvas id="proceedsChart" class="w-full max-w-lg mx-auto"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Theme toggle functionality
    const themeToggleBtn = document.getElementById('theme-toggle');
    
    // Check for saved theme preference, otherwise use system preference
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    // Toggle theme
    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      
      // Save preference
      if (document.documentElement.classList.contains('dark')) {
        localStorage.theme = 'dark';
      } else {
        localStorage.theme = 'light';
      }
    });
  </script>
  <script src="Assets/js/main.js"></script>
</body>
</html>
