<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="shortcut icon" href="Assets/images/icon.png" type="image/jpeg">
  <title id="dynamic-title">WBS Dashboard</title>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1a365d',
            secondary: '#2d3748',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors duration-200">
  <div class="container mx-auto px-4 py-8">
    <header class="mb-12 text-center relative">
      <div class="absolute left-4 top-0">
        <button 
          onclick="window.history.back()" 
          class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200"
          aria-label="Go back"
        >
          <svg class="w-6 h-6 text-gray-700 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
      </div>

      <div class="absolute right-4 top-0">
        <button 
          id="theme-toggle" 
          class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200"
          aria-label="Toggle dark mode"
        >
          <svg class="hidden dark:block w-6 h-6 text-yellow-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <svg class="block dark:hidden w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        </button>
      </div>

      <h1 id="page-title" class="text-4xl font-bold text-primary dark:text-white mb-4"></h1>
      <div class="h-1 w-32 bg-blue-500 mx-auto rounded"></div>
    </header>

    <!-- Top Users Table -->
    <div id="top-users" class="space-y-8"></div>

    <!-- Summary Table -->
    <div id="summary-table" class="space-y-8"></div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const selectedMonth = sessionStorage.getItem("selectedMonth");
      const filteredData = sessionStorage.getItem("filteredMonthData");

      if (!selectedMonth || !filteredData) {
        document.getElementById("filtered-records").innerHTML = 
          "<p class='text-center text-gray-700 dark:text-gray-300'>No records found.</p>";
        return;
      }

      document.getElementById("page-title").innerText = `${selectedMonth} Records`;

      const data = JSON.parse(filteredData);

      const groupedData = {};
      data.forEach(row => {
        const macAddress = row["phone mac Add"] || "Unknown MAC";
        const clientName = row["Client Name"] || "Unknown";

        if (!groupedData[macAddress]) {
          groupedData[macAddress] = { clientName, sessions: 0, totalPaid: 0 };
        }

        groupedData[macAddress].sessions += 1;
        groupedData[macAddress].totalPaid += calculateAmount(row["Time"], {
          dayRate: 20, weekRate: 150, monthRate: 500
        });
      });

      document.getElementById("summary-table").innerHTML = `
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 transition-colors duration-200">
          <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-200 mb-4">User  Payment Summary</h2>
          <div class="overflow-x-auto">
            <table class="min-w-full bg-white dark:bg-gray-900 rounded-lg overflow-hidden">
              <thead class="bg-gray-100 dark:bg-gray-700">
                <tr>
                  <th class="px-2 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">Client Name</th>
                  <th class="px-2 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">Sessions Paid</th>
                  <th class="px-2 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">Total Amount Paid</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200 dark:divide-gray-600">
                ${Object.keys(groupedData).map(mac => `
                  <tr class="hover:bg-gray-50 dark:hover:bg-gray-800">
                    <td class="px-2 py-4 text-sm font-medium text-gray-900 dark:text-gray-200">${groupedData[mac].clientName}</td>
                    <td class="px-2 py-4 text-sm text-gray-500 dark:text-gray-300">${groupedData[mac].sessions}</td>
                    <td class="px-2 py-4 text-sm text-gray-500 dark:text-gray-300">Ksh ${groupedData[mac].totalPaid.toFixed(2)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;

      let mostSessionsUser  = Object.values(groupedData).reduce((a, b) => (a.sessions > b.sessions ? a : b));
      let highestPayer = Object.values(groupedData).reduce((a, b) => (a.totalPaid > b.totalPaid ? a : b));

      document.getElementById("top-users").innerHTML = `
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 transition-colors duration-200">
          <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-200 mb-4">Top Users</h2>
          <div class="overflow-x-auto">
            <table class="min-w-full bg-white dark:bg-gray-900 rounded-lg overflow-hidden">
              <thead class="bg-gray-100 dark:bg-gray-700">
                <tr>
                  <th class="px-2 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">Category</th>
                  <th class="px-2 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">Client Name</th>
                  <th class="px-2 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">Total</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200 dark:divide-gray-600">
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-800">
                  <td class="px-2 py-4 text-sm font-medium text-gray-900 dark:text-gray-200">Most Sessions</td>
                  <td class="px-2 py-4 text-sm text-gray-500 dark:text-gray-300">${mostSessionsUser .clientName}</td>
                  <td class="px-2 py-4 text-sm text-gray-500 dark:text-gray-300">${mostSessionsUser .sessions} Sessions</td>
                </tr>
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-800">
                  <td class="px-2 py-4 text-sm font-medium text-gray-900 dark:text-gray-200">Highest Payment</td>
                  <td class="px-2 py-4 text-sm text-gray-500 dark:text-gray-300">${highestPayer.clientName}</td>
                  <td class="px-2 py-4 text-sm text-gray-500 dark:text-gray-300">Ksh ${highestPayer.totalPaid.toFixed(2)}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `;
    });

    function calculateAmount(time, rates) {
      if (time.includes("24HRS")) return rates.dayRate;
      if (time.includes("1 WEEK")) return rates.weekRate;
      if (time.includes("1 MONTH")) return rates.monthRate;
      const hours = parseInt(time);
      return !isNaN(hours) ? (hours / 24) * rates.dayRate : 0;
    }

    const themeToggleBtn = document.getElementById('theme-toggle');

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    });

    // Hanlde page title
    document.addEventListener("DOMContentLoaded", () => {
        const selectedMonth = sessionStorage.getItem("selectedMonth");
        const storedTitle = sessionStorage.getItem("pageTitle"); // ✅ Get stored title

        if (selectedMonth) {
            document.getElementById("page-title").innerText = `${selectedMonth} Records`;

            // ✅ Ensure title remains correct after loading
            if (storedTitle) {
            document.title = storedTitle; // ✅ Keep the title after page load
            }
        }
        });

  </script>
</body>
</html>
